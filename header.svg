<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <linearGradient id="academicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c1b" />
      <stop offset="50%" stop-color="#1c3d26" />
      <stop offset="100%" stop-color="#285637" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="250" rx="14" fill="url(#academicBg)" />

  <!-- Subtle Genomic / Wave Contour Lines -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2">
    <path d="M-20 200 C 140 140, 240 220, 380 165 S 640 120, 870 175" />
    <path d="M-20 225 C 160 165, 280 240, 420 190 S 660 145, 870 205" />
    <path d="M-20 175 C 120 115, 260 180, 400 130 S 620 85, 870 135" />
  </g>

  <!-- Clean Floating Molecule Accents -->
  <g fill="#ffffff" fill-opacity="0.15">
    <circle cx="85" cy="50" r="3" />
    <circle cx="580" cy="40" r="4" />
    <circle cx="480" cy="210" r="3" />
    <circle cx="310" cy="35" r="2.5" />
    <circle cx="770" cy="190" r="3.5" />
  </g>

  <!-- Typography: Clean Academic Sans-Serif -->
  <g font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, Arial, sans-serif">
    <!-- Field Category -->
    <text x="48" y="65" fill="#a3e3b7" font-size="11.5" font-weight="600" letter-spacing="2">HORTICULTURAL GENOMICS & MULTI-OMICS</text>
    
    <!-- Scientist Name: Crisp, Elegant, Not Overly Thick -->
    <text x="46" y="118" fill="#ffffff" font-size="34" font-weight="600" letter-spacing="0.4">Vivek Yadav, PhD</text>
    
    <!-- Title & Affiliation -->
    <text x="48" y="156" fill="#e2efe6" font-size="14.5" font-weight="400">Associate Researcher & Postdoctoral Fellow</text>
    <text x="48" y="178" fill="#b9d5c2" font-size="13.5" font-weight="400">Xinjiang Academy of Agricultural Sciences, Urumqi, China</text>
    
    <!-- Research Keywords -->
    <text x="48" y="210" fill="#88b594" font-size="12.5" font-weight="400" letter-spacing="0.3">Grapevine Genomics · Domestication · Biotic Stress · Metabolomics · Fruit Quality</text>
  </g>

  <!-- Grapevine & Cluster Illustration -->
  <g transform="translate(685, 125)">
    <!-- Outer Orbit Ring -->
    <circle cx="0" cy="0" r="78" fill="#ffffff" fill-opacity="0.06" />
    <circle cx="0" cy="0" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="3 5" stroke-width="1.2" />

    <!-- Stem & Tendril -->
    <path d="M0 -32 C 0 -50, 16 -60, 26 -64" stroke="#8fd19e" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <!-- Leaf -->
    <path d="M0 -34 C -16 -44, -28 -34, -32 -22 C -18 -20, -5 -26, 0 -34 Z" fill="#58b36e" />

    <!-- Grape Berries -->
    <!-- Top row -->
    <circle cx="-14" cy="-14" r="13" fill="#6d357e" />
    <circle cx="14" cy="-14" r="13" fill="#542366" />

    <!-- Mid row -->
    <circle cx="-25" cy="8" r="12.5" fill="#5e286f" />
    <circle cx="0" cy="7" r="14" fill="#7d3b91" />
    <circle cx="25" cy="8" r="12.5" fill="#542366" />

    <!-- Lower row -->
    <circle cx="-13" cy="28" r="12" fill="#4a1c57" />
    <circle cx="13" cy="28" r="12" fill="#652c78" />

    <!-- Bottom tip -->
    <circle cx="0" cy="46" r="11" fill="#3c1547" />

    <!-- Elegant Highlight Reflections -->
    <circle cx="-17" cy="-18" r="3" fill="#ffffff" fill-opacity="0.28" />
    <circle cx="-3" cy="3" r="3.5" fill="#ffffff" fill-opacity="0.30" />
    <circle cx="10" cy="24" r="2.8" fill="#ffffff" fill-opacity="0.25" />
  </g>
</svg>
